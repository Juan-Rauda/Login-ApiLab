<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>Subir Documentos</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>

  <!-- BOTÓN -->
  <ion-button expand="block" class="boton-agregar" (click)="modalOpen = true">
    <ion-icon name="add-outline" slot="start"></ion-icon>
    Agregar documento
  </ion-button>

  <!-- GRID DOCUMENTOS -->
  <div class="documentos-grid">

    <ion-card class="app-card animate" *ngFor="let doc of documentos">
      <img *ngIf="doc.imagenUrl" [src]="doc.imagenUrl" class="documento-img" />

      <div class="documento-body">
        <div class="app-title">{{ doc.nombre }}</div>
        <div class="app-muted">{{ doc.descripcion }}</div>
        <div class="stock">Stock: {{ doc.cantidad }}</div>

        <ion-button size="small" expand="block" class="boton-pdf" (click)="abrirPdf(doc.pdfUrl)">
          Ver PDF
        </ion-button>
      </div>
    </ion-card>
  </div>

  <!-- MODAL -->
  <ion-modal class="light-modal" [isOpen]="modalOpen" (didDismiss)="modalOpen = false">
    <ng-template>

      <ion-header class="modal-header">
        <ion-toolbar>
          <ion-title> Nuevo documento</ion-title>
          <ion-buttons slot="end">
            <ion-button (click)="modalOpen = false">
              Cerrar
            </ion-button>
          </ion-buttons>
        </ion-toolbar>
      </ion-header>

      <ion-content class="modal-card">

        <!-- FORM -->
        <form class="modal-form">

          <ion-item>
            <ion-input name="nombre" label="Nombre" labelPlacement="floating" [(ngModel)]="nombre">
            </ion-input>
          </ion-item>

          <ion-item>
            <ion-textarea name="descripcion" label="Descripción" labelPlacement="floating" [(ngModel)]="descripcion">
            </ion-textarea>
          </ion-item>

          <ion-item>
            <ion-input name="cantidad" type="number" label="Cantidad" labelPlacement="floating" [(ngModel)]="cantidad">
            </ion-input>
          </ion-item>

          <ion-item>
            <ion-label>Imagen (opcional)</ion-label>
            <input type="file" (change)="seleccionarImagen($event)" />
          </ion-item>

          <ion-item>
            <ion-label>PDF</ion-label>
            <input type="file" accept="application/pdf" (change)="seleccionarPdf($event)" />
          </ion-item>

          <!-- BOTÓN CORREGIDO -->
          <ion-button type="button" expand="block" class="gradient-btn" [disabled]="cargando"
            (click)="subirDocumento()">

            <ng-container *ngIf="!cargando; else loadingTpl">
              Subir documento
            </ng-container>

            <ng-template #loadingTpl>
              <ion-spinner name="crescent"></ion-spinner>
            </ng-template>

          </ion-button>

        </form>
      </ion-content>

    </ng-template>
  </ion-modal>

</ion-content>
