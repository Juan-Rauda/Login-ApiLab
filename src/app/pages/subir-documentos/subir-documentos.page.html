<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>Subir Documentos</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>

  <!-- BOTÓN -->
  <!-- <ion-button expand="block" class="boton-agregar" (click)="modalOpen = true">
    <ion-icon name="add-outline" slot="start"></ion-icon>
    Agregar documento
  </ion-button> -->
  <!-- <ion-button expand="block" class="boton-agregar sticky-btn" (click)="modalOpen = true">
    <ion-icon name="add-outline" slot="start"></ion-icon>
    Agregar documento
  </ion-button> -->

  <!-- GRID DOCUMENTOS -->
  <div class="documentos-grid">

    <ion-card class="app-card animate" *ngFor="let doc of documentos">
      <img *ngIf="doc.imagenUrl" [src]="doc.imagenUrl" class="documento-img" />

      <div class="documento-body">
        <div class="app-title">{{ doc.nombre }}</div>
        <div class="app-muted">{{ doc.descripcion }}</div>
        <div class="stock">Stock: {{ doc.cantidad }}</div>

        <div class="acciones">

          <!-- VER PDF -->
          <ion-button size="small" class="btn-ver" (click)="abrirPdf(doc.pdfUrl)">
            <ion-icon name="eye-outline"></ion-icon>
          </ion-button>

          <!-- EDITAR -->
          <ion-button size="small" class="btn-editar" (click)="abrirEditar(doc)">
            <ion-icon name="create-outline"></ion-icon>
          </ion-button>

          <!-- ELIMINAR -->
          <ion-button size="small" class="btn-eliminar" (click)="eliminarDocumento(doc)">
            <ion-icon name="trash-outline"></ion-icon>
          </ion-button>

        </div>
      </div>
    </ion-card>
  </div>

  <ion-fab vertical="bottom" horizontal="center" slot="fixed">
    <ion-button class="boton-agregar gradient-btn" (click)="modalOpen = true">
      <ion-icon name="add-outline" slot="start"></ion-icon>
      Agregar documento
    </ion-button>
  </ion-fab>

  <!-- MODAL -->
  <ion-modal class="light-modal" [isOpen]="modalOpen" keepContentsMounted="true" (didDismiss)="onModalDismiss()">
    <ng-template>

      <ion-header class="modal-header">
        <ion-toolbar>
          <ion-title>
            {{ editando ? 'Editar documento' : 'Nuevo documento' }}
          </ion-title>
          <ion-buttons slot="end">
            <ion-button (click)="cerrarModal()">
              Cerrar
            </ion-button>
          </ion-buttons>
        </ion-toolbar>
      </ion-header>

      <ion-content class="modal-card">

        <!-- FORM -->
        <form class="modal-form">

          <ion-item>
            <ion-input name="nombre" label="Nombre" labelPlacement="floating" [(ngModel)]="nombre">
            </ion-input>
          </ion-item>

          <ion-item>
            <ion-textarea name="descripcion" label="Descripción" labelPlacement="floating" [(ngModel)]="descripcion">
            </ion-textarea>
          </ion-item>

          <ion-item>
            <ion-input required name="cantidad" type="number" label="Cantidad" labelPlacement="floating"
              [(ngModel)]="cantidad" min="0" step="1" inputmode="numeric" pattern="[0-9]*">
            </ion-input>
          </ion-item>

          <ion-item>
            <ion-label>Imagen (opcional)</ion-label>
            <input #inputImagen type="file" accept="image/png,image/jpeg,image/jpg,image/webp"
              (change)="seleccionarImagen($event)" />
          </ion-item>

          <ion-item>
            <ion-label>PDF</ion-label>
            <input #inputPdf type="file" accept="application/pdf" (change)="seleccionarPdf($event)" />
          </ion-item>
          <ion-note color="medium" *ngIf="editando" class="nota">
            Deja los archivos vacíos si no deseas cambiarlos
          </ion-note>

          <!-- BOTÓN CORREGIDO -->
          <ion-button type="button" expand="block" class="gradient-btn" [disabled]="cargando"
            (click)="subirDocumento()">

            <ng-container *ngIf="!cargando; else loadingTpl">
              {{ editando ? 'Guardar cambios' : 'Subir documento' }}
            </ng-container>

            <ng-template #loadingTpl>
              <ion-spinner name="crescent"></ion-spinner>
            </ng-template>

          </ion-button>

        </form>
      </ion-content>

    </ng-template>
  </ion-modal>

</ion-content>
