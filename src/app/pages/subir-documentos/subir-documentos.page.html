<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button> <!-- Abre el menú global -->
    </ion-buttons>
    <ion-title>
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <ion-card>
    <ion-card-header>
      <ion-card-title>Cargar archivo</ion-card-title>
    </ion-card-header>

    <ion-card-content>

      <input type="file" (change)="seleccionarArchivo($event)" />

      <ion-button expand="block" color="primary" (click)="subirArchivo()">
        Subir archivo
      </ion-button>

      <!-- Progreso -->
      <ion-progress-bar
        *ngIf="subiendo"
        [value]="progreso / 100">
      </ion-progress-bar>

      <p *ngIf="subiendo">{{ progreso }}%</p>

      <p *ngIf="mensaje" style="margin-top: 10px;">
        {{ mensaje }}
      </p>

    </ion-card-content>
  </ion-card>

</ion-content>
