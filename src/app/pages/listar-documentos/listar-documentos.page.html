<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button> <!-- Abre el menú global -->
    </ion-buttons>
    <ion-title>
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <ion-spinner *ngIf="cargando" name="crescent"></ion-spinner>

  <ion-list *ngIf="!cargando && documentos.length > 0">

    <ion-item *ngFor="let doc of documentos">
      <ion-icon name="document-outline" slot="start"></ion-icon>

      <ion-label>
        <h2>{{ doc.nombre }}</h2>
        <p>Documento almacenado</p>
      </ion-label>

      <ion-button fill="outline" slot="end" [href]="doc.url" target="_blank">
        Ver
      </ion-button>
    </ion-item>

  </ion-list>

  <ion-text color="medium" *ngIf="!cargando && documentos.length === 0">
    <p>No hay documentos aún.</p>
  </ion-text>

</ion-content>
